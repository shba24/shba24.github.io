name: Deploy to GitHub Pages

# Production deploy. Triggers ONLY on main (cutover branch) — never on the
# in-progress astro-rebuild branch (that is covered by astro-ci.yml).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Least-privilege token scoped for GitHub Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      # --- Post audio provisioning (ffmpeg + Piper + voice model) ---------
      # Reproducible on ANY machine: the SAME scripts/setup-audio.sh runs
      # locally (`pnpm setup:audio` / `preview:audio`) and here. It installs
      # ffmpeg + the piper-tts CLI, downloads the pinned voice model into
      # ~/.cache/piper-voices, and (in CI) exports PATH + PIPER_MODEL via
      # $GITHUB_PATH/$GITHUB_ENV for the Build step. Best-effort: a transient
      # install/download outage must NOT block the deploy — generate-audio.mjs
      # skips TTS gracefully and the site without audio is still deployable.
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-en_US-lessac-medium-v1.0.0

      - name: Provision audio toolchain (ffmpeg + Piper + model)
        continue-on-error: true
        run: bash scripts/setup-audio.sh

      # Reuse previously synthesized MP3s + the audio manifest when post sources
      # are unchanged, so deploys don't re-run TTS needlessly. generate-audio.mjs
      # skips per-post via manifest.json (also stored under public/audio).
      - name: Cache generated post audio
        uses: actions/cache@v4
        with:
          path: public/audio
          key: post-audio-${{ hashFiles('src/content/posts/**') }}
          restore-keys: |
            post-audio-

      # `pnpm build` also runs Pagefind indexing and OG image generation.
      - name: Build
        run: pnpm build

      # SEO gate: fail the deploy if any indexed URL from the parity checklist
      # is missing from the build output.
      - name: URL parity gate
        run: node scripts/check-url-parity.mjs dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
